<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f4f45" />
    <title>Aplikasi Pusat Kajian</title>
    <style>
:root {
  color-scheme: light;
  --teal-950: #073b34;
  --teal-800: #0f4f45;
  --teal-700: #126356;
  --green-600: #6f8f63;
  --sage-200: #d7e3d1;
  --cream-100: #fbf7ee;
  --warm-100: #f3eadb;
  --white: #ffffff;
  --ink: #14201d;
  --muted: #687570;
  --line: #e4ded2;
  --shadow: 0 18px 45px rgba(12, 57, 50, 0.13);
  --radius: 8px;
  font-family:
    Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at top left, rgba(215, 227, 209, 0.75), transparent 34rem),
    linear-gradient(135deg, #f8f1e4 0%, #eef5ef 48%, #faf8f0 100%);
  color: var(--ink);
}

button {
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

button:disabled {
  cursor: default;
}

.shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
}

.phone-frame {
  width: min(100%, 430px);
  min-height: min(880px, calc(100vh - 36px));
  max-height: calc(100vh - 36px);
  overflow: hidden;
  position: relative;
  background: var(--cream-100);
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 28px;
  box-shadow: var(--shadow);
}

.screen {
  height: min(880px, calc(100vh - 36px));
  overflow-y: auto;
  padding: 24px 20px;
}

.screen.with-nav {
  padding-bottom: 104px;
}

.home-header,
.top-bar,
.back-bar,
.section-heading,
.profile-card,
.related-practice,
.manage-row,
.report-row,
.chart-row {
  display: flex;
  align-items: center;
}

.home-header {
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}

.eyebrow,
.section-kicker,
.category-label {
  margin: 0 0 6px;
  color: var(--teal-700);
  font-size: 0.74rem;
  font-weight: 800;
  letter-spacing: 0;
  text-transform: uppercase;
}

h1,
h2,
h3,
p {
  margin-top: 0;
}

h1 {
  margin-bottom: 4px;
  color: var(--teal-950);
  font-size: 1.85rem;
  line-height: 1.12;
}

h2 {
  margin-bottom: 0;
  font-size: 1.08rem;
}

h3 {
  margin-bottom: 4px;
  font-size: 1rem;
}

.muted,
.top-bar p,
.screen-copy,
.profile-card p,
.practice-row p,
.library-card p,
.article-preview small,
.article p,
.related-practice span {
  color: var(--muted);
}

.icon-button {
  width: 42px;
  height: 42px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 999px;
  background: var(--white);
  color: var(--teal-800);
  box-shadow: 0 8px 22px rgba(15, 79, 69, 0.09);
  font-size: 1.35rem;
}

.progress-panel {
  display: grid;
  grid-template-columns: 1fr 104px;
  align-items: center;
  gap: 18px;
  padding: 20px;
  background: linear-gradient(135deg, var(--teal-800), #1d7464);
  color: var(--white);
  border-radius: 24px;
  box-shadow: 0 16px 32px rgba(15, 79, 69, 0.2);
}

.progress-panel p {
  margin-bottom: 0;
  color: rgba(255, 255, 255, 0.82);
}

.progress-panel strong {
  display: block;
  margin-bottom: 4px;
  font-size: 2.7rem;
  line-height: 1;
}

.progress-panel .section-kicker {
  color: #dceee3;
}

.progress-ring {
  width: 96px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background:
    radial-gradient(circle, var(--teal-800) 0 55%, transparent 56%),
    conic-gradient(#e5d8ab calc(var(--value) * 1%), rgba(255, 255, 255, 0.2) 0);
}

.progress-ring span {
  font-weight: 800;
}

.count-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0 24px;
}

.count-grid div {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.72);
}

.count-grid span {
  display: block;
  color: var(--muted);
  font-size: 0.78rem;
}

.count-grid strong {
  display: block;
  margin-top: 4px;
  font-size: 1.25rem;
}

.section-block {
  margin-top: 22px;
}

.section-block.first-section {
  margin-top: 0;
}

.section-heading {
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-heading span {
  color: var(--muted);
  font-size: 0.85rem;
}

.practice-stack,
.card-list,
.article-list,
.settings-list,
.manage-list,
.report-list,
.chart-list {
  display: grid;
  gap: 12px;
}

.practice-row {
  display: grid;
  grid-template-columns: 46px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--white);
  border: 1px solid transparent;
  border-radius: var(--radius);
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
  cursor: pointer;
}

.practice-row.is-complete {
  border-color: rgba(111, 143, 99, 0.36);
  background: #f7fbf5;
}

.practice-icon,
.visual-tile,
.knowledge-card span,
.avatar {
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #e7dcc8, #d8e7d2);
  color: var(--teal-800);
  font-weight: 900;
}

.practice-icon {
  width: 46px;
  height: 46px;
  border-radius: var(--radius);
  font-size: 0.76rem;
}

.practice-icon.large {
  width: 64px;
  height: 64px;
  font-size: 0.95rem;
}

.complete-button,
.primary-button,
.secondary-button,
.add-practice-button {
  min-height: 42px;
  border-radius: var(--radius);
  font-weight: 800;
}

.complete-button {
  padding: 0 12px;
  background: var(--teal-800);
  color: var(--white);
  font-size: 0.82rem;
  white-space: nowrap;
}

.complete-button.done,
.secondary-button.added {
  background: #eaf3e6;
  color: var(--green-600);
}

.add-practice-button {
  width: 100%;
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: var(--ink);
  color: var(--white);
}

.add-practice-button span {
  font-size: 1.2rem;
  line-height: 1;
}

.home-action-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 18px;
}

.home-action-grid button {
  min-height: 72px;
  display: grid;
  place-items: center;
  gap: 6px;
  padding: 12px;
  border-radius: var(--radius);
  background: var(--white);
  color: var(--teal-800);
  font-weight: 800;
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
}

.home-action-grid span {
  font-size: 1.3rem;
  line-height: 1;
}

.text-button {
  min-height: 32px;
  padding: 0 10px;
  border-radius: 999px;
  background: var(--warm-100);
  color: var(--teal-800);
  font-size: 0.78rem;
  font-weight: 800;
  white-space: nowrap;
}

.top-bar {
  min-height: 92px;
  align-items: flex-end;
  margin-bottom: 18px;
}

.top-bar p {
  margin-bottom: 0;
}

.back-bar {
  gap: 12px;
  margin-bottom: 18px;
}

.back-bar h1 {
  margin: 0;
  font-size: 1.38rem;
}

.chip-row,
.tab-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chip,
.tab {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.74);
  color: var(--muted);
  font-weight: 700;
}

.chip.active,
.tab.active {
  border-color: var(--teal-800);
  background: var(--teal-800);
  color: var(--white);
}

.library-card {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 14px;
  padding: 12px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
  cursor: pointer;
}

.visual-tile {
  min-height: 112px;
  border-radius: var(--radius);
  background:
    linear-gradient(145deg, rgba(15, 79, 69, 0.08), rgba(229, 216, 171, 0.5)),
    repeating-linear-gradient(45deg, rgba(15, 79, 69, 0.09) 0 1px, transparent 1px 9px);
}

.visual-tile span {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.76);
}

.library-body {
  display: grid;
  gap: 12px;
}

.time-pill {
  display: inline-flex;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 999px;
  background: var(--warm-100);
  color: var(--teal-800);
  font-size: 0.76rem;
  font-weight: 700;
}

.primary-button,
.secondary-button {
  width: 100%;
  padding: 0 14px;
  background: var(--teal-800);
  color: var(--white);
}

.primary-button.compact {
  width: fit-content;
}

.secondary-button.compact {
  width: fit-content;
  background: var(--warm-100);
  color: var(--teal-800);
}

.knowledge-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.knowledge-card {
  min-height: 158px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 15px;
  text-align: left;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
}

.knowledge-card span {
  width: 42px;
  height: 42px;
  border-radius: var(--radius);
  font-size: 0.78rem;
}

.knowledge-card small {
  color: var(--muted);
  line-height: 1.45;
}

.article-preview {
  display: grid;
  gap: 7px;
  padding: 16px;
  text-align: left;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
}

.article-preview span {
  color: var(--teal-700);
  font-size: 0.78rem;
  font-weight: 800;
}

.article {
  padding: 18px;
  background: var(--white);
  border-radius: var(--radius);
}

.article h1 {
  font-size: 1.8rem;
}

.article .lead {
  color: var(--teal-800);
  font-size: 1.02rem;
}

.article section {
  padding-top: 8px;
}

.article h2 {
  margin: 14px 0 6px;
  font-size: 1rem;
}

.article p {
  line-height: 1.68;
}

.related-practice {
  margin-top: 14px;
  padding: 16px;
  align-items: stretch;
  flex-direction: column;
  gap: 12px;
  background: #edf6ea;
  border: 1px solid rgba(111, 143, 99, 0.24);
  border-radius: var(--radius);
}

.media-feature {
  overflow: hidden;
  margin-bottom: 14px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
}

.media-poster {
  min-height: 178px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  padding: 20px;
  background:
    radial-gradient(circle at 82% 18%, rgba(255, 255, 255, 0.28), transparent 34%),
    linear-gradient(135deg, var(--teal-800), #6f8f63);
  color: var(--white);
}

.media-poster span {
  color: rgba(255, 255, 255, 0.84);
  font-size: 0.74rem;
  font-weight: 800;
  text-transform: uppercase;
}

.media-poster strong {
  max-width: 280px;
  font-size: 1.55rem;
  line-height: 1.12;
}

.media-poster.image-poster {
  min-height: 0;
  height: 260px;
  padding: 0;
  background: var(--white);
}

.media-poster.image-poster img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  object-position: top center;
}

.media-feature-body {
  padding: 15px;
}

.media-feature-body .secondary-button {
  margin-top: 12px;
}

.media-feature-body p:last-child,
.media-card-body p {
  margin-bottom: 0;
  color: var(--muted);
  line-height: 1.45;
}

.media-list {
  display: grid;
  gap: 12px;
}

.media-list.compact-list .media-card {
  box-shadow: 0 8px 18px rgba(44, 54, 49, 0.05);
}

.media-card {
  display: grid;
  grid-template-columns: 58px 1fr;
  gap: 12px;
  padding: 14px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
}

.media-thumb {
  width: 58px;
  height: 58px;
  display: grid;
  place-items: center;
  border-radius: var(--radius);
  background: linear-gradient(145deg, #e7dcc8, #d8e7d2);
  color: var(--teal-800);
  font-size: 0.78rem;
  font-weight: 900;
}

.media-card.video .media-thumb {
  background: #ffe8df;
  color: #9c331c;
}

.media-card.podcast .media-thumb {
  background: #e5edf7;
  color: #24537d;
}

.media-card.article .media-thumb {
  background: #edf6ea;
  color: var(--green-600);
}

.media-card .secondary-button {
  grid-column: 2;
  min-height: 38px;
}

.media-detail {
  display: grid;
  gap: 14px;
  padding: 18px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
}

.detail-poster {
  min-height: 210px;
  border-radius: var(--radius);
}

.media-detail .image-poster {
  height: auto;
}

.media-detail .image-poster img {
  height: auto;
  object-fit: contain;
}

.media-detail h1 {
  margin-bottom: 0;
  font-size: 1.72rem;
}

.media-detail .lead {
  color: var(--teal-800);
  font-size: 1.02rem;
  line-height: 1.55;
}

.media-detail section {
  padding-top: 4px;
}

.media-detail h2 {
  margin-bottom: 7px;
  font-size: 1rem;
}

.media-detail p {
  margin-bottom: 0;
  color: var(--muted);
  line-height: 1.68;
}

.media-author {
  padding-top: 8px;
  color: var(--teal-800) !important;
  font-weight: 800;
}

.practice-detail {
  display: grid;
  gap: 14px;
}

.guide-list {
  display: grid;
  gap: 14px;
}

.guide-step {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  padding: 16px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
}

.step-number {
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--teal-800);
  color: var(--white);
  font-weight: 900;
}

.step-content h2 {
  margin-bottom: 8px;
  font-size: 1.02rem;
}

.step-instruction,
.meaning-text,
.step-evidence {
  color: var(--muted);
  line-height: 1.62;
}

.step-instruction {
  margin-bottom: 10px;
}

.meaning-text {
  margin: 12px 0 0;
}

.step-evidence {
  margin: 12px 0 0;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 0.92rem;
}

.practice-detail-header,
.recitation-card,
.meaning-card,
.evidence-card,
.note-card {
  padding: 18px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
}

.practice-detail-header {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 14px;
  align-items: start;
}

.practice-detail-header h1 {
  margin-bottom: 8px;
  font-size: 1.65rem;
}

.practice-detail-header p {
  margin-bottom: 8px;
  color: var(--muted);
}

.recitation-card {
  background: linear-gradient(145deg, #fffdf7, #eef7ec);
}

.arabic-text {
  margin: 14px 0 0;
  color: var(--teal-950);
  font-family: "Geeza Pro", "Noto Naskh Arabic", "Amiri", serif;
  font-size: 1.55rem;
  font-weight: 700;
  line-height: 2.1;
  text-align: right;
}

.meaning-card h2,
.evidence-card h2,
.note-card h2 {
  margin-bottom: 8px;
}

.meaning-card p,
.evidence-card p,
.note-card p {
  margin-bottom: 10px;
  color: var(--muted);
  line-height: 1.65;
}

.meaning-card p:last-child,
.evidence-card p:last-child,
.note-card p:last-child {
  margin-bottom: 0;
}

.note-card {
  background: #f8f1e4;
  border: 1px solid var(--line);
  box-shadow: none;
}

.detail-actions {
  padding: 4px 0 18px;
}

.report-panel {
  padding: 20px;
  margin-bottom: 14px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
}

.report-panel strong {
  display: block;
  margin-bottom: 3px;
  color: var(--teal-800);
  font-size: 2.45rem;
  line-height: 1;
}

.report-panel p:last-child {
  margin-bottom: 0;
  color: var(--muted);
}

.report-row {
  gap: 10px;
  padding: 13px 14px;
  background: var(--white);
  border-radius: var(--radius);
}

.status {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--warm-100);
  color: var(--muted);
  font-weight: 800;
}

.status.done {
  background: #eaf3e6;
  color: var(--green-600);
}

.chart-row {
  grid-template-columns: 64px 1fr 42px;
  gap: 10px;
  padding: 12px;
  background: var(--white);
  border-radius: var(--radius);
}

.bar {
  height: 10px;
  overflow: hidden;
  border-radius: 999px;
  background: var(--warm-100);
}

.bar i {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--teal-700);
}

.calendar-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
  padding: 12px;
  background: var(--white);
  border-radius: var(--radius);
}

.calendar-day {
  min-height: 43px;
  display: grid;
  place-items: center;
  gap: 1px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  font-size: 0.74rem;
}

.calendar-day.consistent {
  border-color: rgba(111, 143, 99, 0.4);
  background: #edf6ea;
  color: var(--green-600);
}

.calendar-day.future {
  opacity: 0.35;
}

.profile-card {
  gap: 14px;
  padding: 18px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
}

.avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;
  font-size: 1.4rem;
}

.profile-card h2,
.profile-card p {
  margin-bottom: 3px;
}

.manage-row {
  justify-content: space-between;
  gap: 12px;
  padding: 13px 14px;
  background: var(--white);
  border-radius: var(--radius);
}

.manage-row button,
.settings-list button {
  min-height: 38px;
  padding: 0 12px;
  border-radius: var(--radius);
  background: var(--warm-100);
  color: var(--teal-800);
  font-weight: 800;
}

.settings-list {
  margin-top: 16px;
}

.settings-list button {
  width: 100%;
  text-align: left;
  background: var(--white);
}

.empty-state {
  padding: 20px;
  text-align: center;
  background: var(--white);
  border-radius: var(--radius);
}

.bottom-nav {
  position: absolute;
  right: 14px;
  bottom: 14px;
  left: 14px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 8px;
  border: 1px solid rgba(228, 222, 210, 0.8);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.88);
  backdrop-filter: blur(16px);
  box-shadow: 0 14px 32px rgba(44, 54, 49, 0.16);
}

.bottom-nav button {
  min-width: 0;
  min-height: 58px;
  display: grid;
  place-items: center;
  gap: 2px;
  border-radius: 16px;
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 800;
}

const STORAGE_KEY = "pusat_kajian_mvp_state";

const todayIds = ["zikir-pagi", "zikir-petang", "baca-quran", "solat-dhuha", "zikir-doa-tidur", "istiazah"];

const historicalCompletions = [
  ["zikir-pagi", -1],
  ["zikir-petang", -1],
  ["baca-quran", -1],
  ["zikir-pagi", -2],
  ["baca-quran", -2],
  ["solat-dhuha", -2],
  ["zikir-pagi", -3],
  ["zikir-petang", -3],
  ["baca-quran", -3],
  ["solat-dhuha", -3],
  ["zikir-pagi", -4],
  ["baca-quran", -4],
  ["zikir-pagi", -5],
  ["zikir-petang", -5],
  ["baca-quran", -5],
  ["zikir-pagi", -6],
  ["zikir-petang", -6],
  ["solat-dhuha", -6]
];

function getLocalDate(offsetDays = 0) {
  const date = new Date();
  date.setDate(date.getDate() + offsetDays);
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function createInitialState() {
  const now = new Date().toISOString();
  const userPractices = todayIds.map((practiceId, index) => ({
    id: `up_${practiceId}`,
    userId: user.id,
    practiceId,
    isActive: true,
    addedAt: new Date(Date.now() - (index + 8) * 86400000).toISOString(),
    removedAt: null
  }));

  const completions = historicalCompletions.map(([practiceId, offsetDays]) => {
    const completionDate = getLocalDate(offsetDays);
    return {
      id: `pc_${practiceId}_${completionDate}`,
      userId: user.id,
      practiceId,
      completionDate,
      status: "completed",
      completedAt: new Date(Date.now() + offsetDays * 86400000 + 3600000).toISOString()
    };
  });

  return {
    user,
    userPractices,
    completions,
    createdAt: now,
    updatedAt: now
  };
}

function loadState() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (!stored) {
    const initialState = createInitialState();
    saveState(initialState);
    return initialState;
  }

  try {
    const parsedState = JSON.parse(stored);
    ensureSeedPractices(parsedState);
    saveState(parsedState);
    return parsedState;
  } catch {
    const initialState = createInitialState();
    saveState(initialState);
    return initialState;
  }
}

function ensureSeedPractices(state) {
  todayIds.forEach((practiceId) => {
    const existing = state.userPractices.find((item) => item.practiceId === practiceId);
    if (existing) return;

    state.userPractices.push({
      id: `up_${practiceId}`,
      userId: state.user.id,
      practiceId,
      isActive: true,
      addedAt: new Date().toISOString(),
      removedAt: null
    });
  });
}

function saveState(state) {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      ...state,
      updatedAt: new Date().toISOString()
    })
  );
}

function resetState() {
  const initialState = createInitialState();
  saveState(initialState);
  return initialState;
}

function getActiveUserPractices(state) {
  return state.userPractices
    .filter((item) => item.isActive)
    .map((item) => ({
      ...item,
      practice: practices.find((practice) => practice.id === item.practiceId)
    }))
    .filter((item) => item.practice)
    .sort((a, b) => a.practice.sortOrder - b.practice.sortOrder);
}

function isPracticeAdded(state, practiceId) {
  return state.userPractices.some((item) => item.practiceId === practiceId && item.isActive);
}

function addPractice(state, practiceId) {
  const existing = state.userPractices.find((item) => item.practiceId === practiceId);
  if (existing) {
    existing.isActive = true;
    existing.removedAt = null;
  } else {
    state.userPractices.push({
      id: `up_${practiceId}_${Date.now()}`,
      userId: state.user.id,
      practiceId,
      isActive: true,
      addedAt: new Date().toISOString(),
      removedAt: null
    });
  }
  saveState(state);
}

function removePractice(state, practiceId) {
  const existing = state.userPractices.find((item) => item.practiceId === practiceId && item.isActive);
  if (!existing) return;

  existing.isActive = false;
  existing.removedAt = new Date().toISOString();
  saveState(state);
}

function completePractice(state, practiceId, completionDate = getLocalDate()) {
  const existing = state.completions.find(
    (item) => item.practiceId === practiceId && item.userId === state.user.id && item.completionDate === completionDate
  );

  if (existing) {
    existing.status = "completed";
    existing.completedAt = new Date().toISOString();
  } else {
    state.completions.push({
      id: `pc_${practiceId}_${completionDate}`,
      userId: state.user.id,
      practiceId,
      completionDate,
      status: "completed",
      completedAt: new Date().toISOString()
    });
  }

  saveState(state);
}

function getCompletedPracticeIds(state, completionDate = getLocalDate()) {
  return new Set(
    state.completions
      .filter((item) => item.completionDate === completionDate && item.status === "completed")
      .map((item) => item.practiceId)
  );
}

function getDailySummary(state, completionDate = getLocalDate()) {
  const activePractices = getActiveUserPractices(state);
  const completedIds = getCompletedPracticeIds(state, completionDate);
  const completed = activePractices.filter((item) => completedIds.has(item.practiceId)).length;
  const total = activePractices.length;
  const pending = Math.max(total - completed, 0);
  const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

  return {
    completionDate,
    total,
    completed,
    pending,
    percentage,
    activePractices,
    completedIds
  };
}

function getWeekDates() {
  return Array.from({ length: 7 }, (_, index) => getLocalDate(index - 6));
}

function getWeeklyReport(state) {
  const dayNames = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
  const activePractices = getActiveUserPractices(state);
  const days = getWeekDates().map((dateString) => {
    const date = new Date(`${dateString}T00:00:00`);
    const completedIds = getCompletedPracticeIds(state, dateString);
    const completed = activePractices.filter((item) => completedIds.has(item.practiceId)).length;
    const total = activePractices.length;
    const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
    return {
      date: dateString,
      label: dayNames[date.getDay()],
      completed,
      total,
      percentage
    };
  });

  const average = days.length > 0 ? Math.round(days.reduce((sum, day) => sum + day.percentage, 0) / days.length) : 0;
  const mostConsistent = activePractices
    .map((item) => {
      const count = days.filter((day) => getCompletedPracticeIds(state, day.date).has(item.practiceId)).length;
      return { title: item.practice.title, count };
    })
    .sort((a, b) => b.count - a.count)[0] || { title: "-", count: 0 };

  return { days, average, mostConsistent };
}

function getMonthlyReport(state) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = now.getDate();
  const activePractices = getActiveUserPractices(state);

  const days = Array.from({ length: daysInMonth }, (_, index) => {
    const day = index + 1;
    const dateString = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const completedIds = getCompletedPracticeIds(state, dateString);
    const completed = activePractices.filter((item) => completedIds.has(item.practiceId)).length;
    const total = activePractices.length;
    const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

    return {
      day,
      date: dateString,
      isFuture: day > today,
      completed,
      total,
      percentage,
      isConsistent: total > 0 && completed === total
    };
  });

  const elapsedDays = days.filter((day) => !day.isFuture);
  const average =
    elapsedDays.length > 0 ? Math.round(elapsedDays.reduce((sum, day) => sum + day.percentage, 0) / elapsedDays.length) : 0;
  const consistentDays = elapsedDays.filter((day) => day.isConsistent).length;
  const totalCompleted = elapsedDays.reduce((sum, day) => sum + day.completed, 0);

  return {
    days,
    average,
    consistentDays,
    elapsedDays: elapsedDays.length,
    totalCompleted
  };
}


let state = loadState();
let route = parseRoute();
let selectedPracticeCategory = "semua";
let selectedMediaType = "semua";
let reportTab = "today";

const navItems = [
  { route: "/home", label: "Utama", icon: "⌂" },
  { route: "/practices", label: "Amalan", icon: "✓" },
  { route: "/media", label: "Kandungan", icon: "▣" },
  { route: "/knowledge", label: "Ilmu", icon: "◇" },
  { route: "/profile", label: "Saya", icon: "○" }
];

const app = document.querySelector("#app");

window.addEventListener("hashchange", () => {
  route = parseRoute();
  render();
});

document.addEventListener("click", (event) => {
  const actionElement = event.target.closest("[data-action]");
  if (!actionElement) return;

  const { action, id, route: nextRoute, category, tab } = actionElement.dataset;

  if (action === "navigate") navigate(nextRoute);
  if (action === "select-practice-category") {
    selectedPracticeCategory = category;
    render();
  }
  if (action === "select-media-type") {
    selectedMediaType = category;
    render();
  }
  if (action === "add-practice") {
    addPractice(state, id);
    state = loadState();
    render();
  }
  if (action === "remove-practice") {
    removePractice(state, id);
    state = loadState();
    render();
  }
  if (action === "complete-practice") {
    completePractice(state, id);
    state = loadState();
    render();
  }
  if (action === "report-tab") {
    reportTab = tab;
    render();
  }
  if (action === "reset-demo") {
    state = resetState();
    render();
  }
});

function parseRoute() {
  const hash = window.location.hash.replace(/^#/, "");
  return hash || "/home";
}

function navigate(nextRoute) {
  window.location.hash = nextRoute;
}

function render() {
  const page = renderRoute();
  app.innerHTML = `
    <main class="shell">
      <section class="phone-frame">
        ${page}
        ${renderBottomNav()}
      </section>
    </main>
  `;
}

function renderRoute() {
  if (route.startsWith("/practice/")) {
    return renderPracticeDetail(route.replace("/practice/", ""));
  }
  if (route.startsWith("/knowledge/article/")) {
    return renderArticle(route.replace("/knowledge/article/", ""));
  }
  if (route.startsWith("/knowledge/category/")) {
    return renderKnowledgeCategory(route.replace("/knowledge/category/", ""));
  }
  if (route.startsWith("/media/item/")) {
    return renderMediaDetail(route.replace("/media/item/", ""));
  }

  const routes = {
    "/home": renderHome,
    "/knowledge": renderKnowledge,
    "/practices": renderPractices,
    "/media": renderMedia,
    "/reports": renderReports,
    "/profile": renderProfile
  };

  return (routes[route] || renderHome)();
}

            <button
              class="${isNavActive(item.route) ? "active" : ""}"
              data-action="navigate"
              data-route="${item.route}"
            >
              <span>${item.icon}</span>
              ${item.label}
            </button>
          `
        )
        .join("")}
    </nav>
  `;
}

function renderTopBar(title, subtitle) {
  return `
    <header class="top-bar">
      <div>
        <h1>${title}</h1>
        <p>${subtitle}</p>
      </div>
    </header>
  `;
}

function renderBackBar(title, backRoute) {
  return `
    <header class="back-bar">
      <button class="icon-button" data-action="navigate" data-route="${backRoute}" aria-label="Kembali">‹</button>
      <h1>${title}</h1>
    </header>
  `;
}

function isNavActive(navRoute) {
  if (navRoute === "/practices" && route.startsWith("/practice/")) return true;
  if (navRoute === "/knowledge" && route.startsWith("/knowledge")) return true;
  return route === navRoute;
}

function getKnowledgeCategoryTitle(categoryId) {
  return knowledgeCategories.find((category) => category.id === categoryId)?.title || "Ilmu";
}

function getMediaIcon(type) {
  const icons = {
    poster: "PH",
    video: "YT",
    podcast: "AU",
    article: "AR"
  };
  return icons[type] || "MD";
}

function formatDate(dateString) {
  return new Intl.DateTimeFormat("ms-MY", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(new Date(`${dateString}T00:00:00`));
}

if (!window.location.hash) {
  window.location.hash = "/home";
} else {
  render();
}

    </script>
  </body>
</html>
