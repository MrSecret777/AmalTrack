:root {

* {

}

body {

    linear-gradient(135deg, #f8f1e4 0%, #eef5ef 48%, #faf8f0 100%);

}

button {
  border: 0;
  font: inherit;
  color: inherit;
  cursor: pointer;
}

button:disabled {
  cursor: default;
}

.shell {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 18px;
}

.phone-frame {
  width: min(100%, 430px);
  min-height: min(880px, calc(100vh - 36px));
  max-height: calc(100vh - 36px);
  overflow: hidden;
  position: relative;
  background: var(--cream-100);
  border: 1px solid rgba(255, 255, 255, 0.75);
  border-radius: 28px;
  box-shadow: var(--shadow);
}

.screen {

  overflow-y: auto;
  padding: 24px 20px;
}

.screen.with-nav {
  padding-bottom: 104px;
}

.home-header,
.top-bar,
.back-bar,
.section-heading,
.profile-card,
.related-practice,
.manage-row,
.report-row,
.chart-row {

}

.home-header {

}

.eyebrow,
.section-kicker,

}

h1,
h2,
h3,
p {

}

h1 {

h2 {

}

h3 {

}

.muted,
.top-bar p,
.screen-copy,
.profile-card p,
.practice-row p,
.library-card p,
.article-preview small,
.article p,
.related-practice span {

}

.icon-button {

  place-items: center;

}

.progress-panel {

.progress-panel strong {

}

.progress-ring {
  width: 96px;
  aspect-ratio: 1;
  display: grid;
  place-items: center;
  border-radius: 50%;

.progress-ring span {

}

.count-grid {

  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin: 14px 0 24px;
}

.count-grid div {
  padding: 13px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: rgba(255, 255, 255, 0.72);
}

.count-grid span {
  display: block;
  color: var(--muted);
  font-size: 0.78rem;
}

.count-grid strong {
  display: block;
  margin-top: 4px;
  font-size: 1.25rem;
}

.section-block {
  margin-top: 22px;
}

.section-heading {
  justify-content: space-between;
  margin-bottom: 12px;
}

.section-heading span {
  color: var(--muted);
  font-size: 0.85rem;
}

.practice-stack,
.card-list,
.article-list,
.settings-list,
.manage-list,
.report-list,
.chart-list {

  gap: 12px;
}

.practice-row {
  display: grid;
  grid-template-columns: 46px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 14px;
  background: var(--white);
  border: 1px solid transparent;
  border-radius: var(--radius);
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
  cursor: pointer;
}

.practice-row.is-complete {
  border-color: rgba(111, 143, 99, 0.36);
  background: #f7fbf5;
}

.practice-icon,
.visual-tile,
.knowledge-card span,
.avatar {
  display: grid;
  place-items: center;
  background: linear-gradient(145deg, #e7dcc8, #d8e7d2);
  color: var(--teal-800);
  font-weight: 900;
}

.practice-icon {
  width: 46px;
  height: 46px;
  border-radius: var(--radius);
  font-size: 0.76rem;
}

.practice-icon.large {
  width: 64px;
  height: 64px;
  font-size: 0.95rem;
}

.complete-button,
.primary-button,
.secondary-button,
.add-practice-button {
  min-height: 42px;
  border-radius: var(--radius);
  font-weight: 800;
}

.complete-button {
  padding: 0 12px;
  background: var(--teal-800);
  color: var(--white);
  font-size: 0.82rem;
  white-space: nowrap;
}

.complete-button.done,
.secondary-button.added {
  background: #eaf3e6;
  color: var(--green-600);
}

.add-practice-button {
  width: 100%;
  margin-top: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: var(--ink);
  color: var(--white);
}

.add-practice-button span {
  font-size: 1.2rem;
  line-height: 1;
}

.top-bar {

}

.top-bar p {
  margin-bottom: 0;
}

.back-bar {
  gap: 12px;
  margin-bottom: 18px;
}

.back-bar h1 {

  font-size: 1.38rem;
}

.chip-row,
.tab-row {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
}

.chip,
.tab {
  flex: 0 0 auto;
  min-height: 38px;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.74);
  color: var(--muted);
  font-weight: 700;
}

.chip.active,
.tab.active {
  border-color: var(--teal-800);
  background: var(--teal-800);
  color: var(--white);
}

.library-card {
  display: grid;
  grid-template-columns: 88px 1fr;
  gap: 14px;
  padding: 12px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
  cursor: pointer;
}

.visual-tile {
  min-height: 112px;
  border-radius: var(--radius);
  background:

}

.visual-tile span {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.76);
}

.library-body {
  display: grid;
  gap: 12px;
}

.time-pill {
  display: inline-flex;
  margin-top: 8px;
  padding: 5px 9px;
  border-radius: 999px;
  background: var(--warm-100);
  color: var(--teal-800);
  font-size: 0.76rem;
  font-weight: 700;
}

.primary-button,
.secondary-button {
  width: 100%;
  padding: 0 14px;
  background: var(--teal-800);
  color: var(--white);
}

.primary-button.compact {
  width: fit-content;
}

.knowledge-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.knowledge-card {
  min-height: 158px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 8px;
  padding: 15px;
  text-align: left;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
}

.knowledge-card span {

  height: 42px;
  border-radius: var(--radius);
  font-size: 0.78rem;
}

.knowledge-card small {
  color: var(--muted);
  line-height: 1.45;
}

.article-preview {

  gap: 7px;
  padding: 16px;
  text-align: left;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 10px 24px rgba(44, 54, 49, 0.06);
}

.article-preview span {
  color: var(--teal-700);
  font-size: 0.78rem;
  font-weight: 800;
}

.article {

}

.article h1 {
  font-size: 1.8rem;
}

.article .lead {
  color: var(--teal-800);
  font-size: 1.02rem;
}

.article section {
  padding-top: 8px;
}

.article h2 {
  margin: 14px 0 6px;

}

.article p {

}

.related-practice {

  gap: 12px;
  background: #edf6ea;
  border: 1px solid rgba(111, 143, 99, 0.24);
  border-radius: var(--radius);
}

.practice-detail {

  gap: 14px;
}

.practice-detail-header,
.recitation-card,
.meaning-card,
.evidence-card,
.note-card {
  padding: 18px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);

.practice-detail-header {

  grid-template-columns: 64px 1fr;
  gap: 14px;
  align-items: start;
}

.practice-detail-header h1 {
  margin-bottom: 8px;
  font-size: 1.65rem;
}

.practice-detail-header p {
  margin-bottom: 8px;

}

.recitation-card {

}

.arabic-text {

.meaning-card h2,
.evidence-card h2,

.meaning-card p,

}

}

.note-card {

.report-panel {

.report-panel strong {

}

.report-panel p:last-child {

  color: var(--muted);
}

.report-row {

  background: var(--white);

}

.status {

  place-items: center;

  background: var(--warm-100);
  color: var(--muted);
  font-weight: 800;
}

.status.done {

  color: var(--green-600);
}

.chart-row {

  padding: 12px;
  background: var(--white);

}

.bar {

}

}

.calendar-grid {

  padding: 12px;
  background: var(--white);

  place-items: center;
  gap: 1px;
  border: 1px solid var(--line);
  border-radius: 6px;
  color: var(--muted);
  font-size: 0.74rem;
}

.calendar-day.consistent {
  border-color: rgba(111, 143, 99, 0.4);
  background: #edf6ea;
  color: var(--green-600);
}

.calendar-day.future {
  opacity: 0.35;
}

.profile-card {
  gap: 14px;
  padding: 18px;
  background: var(--white);
  border-radius: var(--radius);
  box-shadow: 0 12px 28px rgba(44, 54, 49, 0.06);
}

.avatar {
  width: 58px;
  height: 58px;
  border-radius: 50%;

}

.profile-card h2,
.profile-card p {
  margin-bottom: 3px;

.manage-row {

  padding: 13px 14px;

}

.manage-row button,
.settings-list button {
  min-height: 38px;
  padding: 0 12px;
  border-radius: var(--radius);
  background: var(--warm-100);
  color: var(--teal-800);
  font-weight: 800;
}

.settings-list {
  margin-top: 16px;
}

.settings-list button {
  width: 100%;
  text-align: left;
  background: var(--white);
}

.empty-state {
  padding: 20px;
  text-align: center;
  background: var(--white);
  border-radius: var(--radius);
}

.bottom-nav {
  position: absolute;
  right: 14px;
  bottom: 14px;
  left: 14px;
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 8px;
  border: 1px solid rgba(228, 222, 210, 0.8);
  border-radius: 22px;
  background: rgba(255, 255, 255, 0.88);

.bottom-nav button {
  min-width: 0;
  min-height: 58px;
  display: grid;
  place-items: center;
  gap: 2px;
  border-radius: 16px;
  background: transparent;
  color: var(--muted);
  font-size: 0.72rem;
  font-weight: 800;
}

.bottom-nav span {
  font-size: 1.06rem;
  line-height: 1;
}

.bottom-nav button.active {
  background: var(--teal-800);
  color: var(--white);
}

@media (max-width: 460px) {
  .shell {
    padding: 0;
  }

  .phone-frame {
    width: 100%;
    min-height: 100vh;
    max-height: 100vh;
    border: 0;
    border-radius: 0;
  }

  .screen {
    height: 100vh;
  }
}

@media (max-width: 365px) {
  .practice-row {
    grid-template-columns: 42px 1fr;
  }

  .complete-button {
    grid-column: 2;
    width: fit-content;
  }

  .library-card {
    grid-template-columns: 1fr;
  }

  .visual-tile {
    min-height: 86px;
  }
}

function getLocalDate(offsetDays = 0) {
  const date = new Date();
  date.setDate(date.getDate() + offsetDays);
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, "0");
  const day = String(date.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function createInitialState() {
  const now = new Date().toISOString();
  const userPractices = todayIds.map((practiceId, index) => ({
    id: `up_${practiceId}`,
    userId: user.id,
    practiceId,
    isActive: true,
    addedAt: new Date(Date.now() - (index + 8) * 86400000).toISOString(),
    removedAt: null
  }));

  const completions = historicalCompletions.map(([practiceId, offsetDays]) => {
    const completionDate = getLocalDate(offsetDays);
    return {
      id: `pc_${practiceId}_${completionDate}`,
      userId: user.id,
      practiceId,
      completionDate,
      status: "completed",
      completedAt: new Date(Date.now() + offsetDays * 86400000 + 3600000).toISOString()
    };
  });

  return {
    user,
    userPractices,
    completions,
    createdAt: now,
    updatedAt: now
  };
}

function loadState() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (!stored) {
    const initialState = createInitialState();
    saveState(initialState);
    return initialState;
  }

  try {
    return JSON.parse(stored);
  } catch {
    const initialState = createInitialState();
    saveState(initialState);
    return initialState;
  }
}

function saveState(state) {
  localStorage.setItem(
    STORAGE_KEY,
    JSON.stringify({
      ...state,
      updatedAt: new Date().toISOString()
    })
  );
}

function resetState() {
  const initialState = createInitialState();
  saveState(initialState);
  return initialState;
}

function getActiveUserPractices(state) {
  return state.userPractices
    .filter((item) => item.isActive)
    .map((item) => ({
      ...item,
      practice: practices.find((practice) => practice.id === item.practiceId)
    }))
    .filter((item) => item.practice)
    .sort((a, b) => a.practice.sortOrder - b.practice.sortOrder);
}

function isPracticeAdded(state, practiceId) {
  return state.userPractices.some((item) => item.practiceId === practiceId && item.isActive);
}

function addPractice(state, practiceId) {
  const existing = state.userPractices.find((item) => item.practiceId === practiceId);
  if (existing) {
    existing.isActive = true;
    existing.removedAt = null;
  } else {
    state.userPractices.push({
      id: `up_${practiceId}_${Date.now()}`,
      userId: state.user.id,
      practiceId,
      isActive: true,
      addedAt: new Date().toISOString(),
      removedAt: null
    });
  }
  saveState(state);
}

function removePractice(state, practiceId) {
  const existing = state.userPractices.find((item) => item.practiceId === practiceId && item.isActive);
  if (!existing) return;

  existing.isActive = false;
  existing.removedAt = new Date().toISOString();
  saveState(state);
}

function completePractice(state, practiceId, completionDate = getLocalDate()) {
  const existing = state.completions.find(
    (item) => item.practiceId === practiceId && item.userId === state.user.id && item.completionDate === completionDate
  );

  if (existing) {
    existing.status = "completed";
    existing.completedAt = new Date().toISOString();
  } else {
    state.completions.push({
      id: `pc_${practiceId}_${completionDate}`,
      userId: state.user.id,
      practiceId,
      completionDate,
      status: "completed",
      completedAt: new Date().toISOString()
    });
  }

  saveState(state);
}

function getCompletedPracticeIds(state, completionDate = getLocalDate()) {
  return new Set(
    state.completions
      .filter((item) => item.completionDate === completionDate && item.status === "completed")
      .map((item) => item.practiceId)
  );
}

function getDailySummary(state, completionDate = getLocalDate()) {
  const activePractices = getActiveUserPractices(state);
  const completedIds = getCompletedPracticeIds(state, completionDate);
  const completed = activePractices.filter((item) => completedIds.has(item.practiceId)).length;
  const total = activePractices.length;
  const pending = Math.max(total - completed, 0);
  const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

  return {
    completionDate,
    total,
    completed,
    pending,
    percentage,
    activePractices,
    completedIds
  };
}

function getWeekDates() {
  return Array.from({ length: 7 }, (_, index) => getLocalDate(index - 6));
}

function getWeeklyReport(state) {
  const dayNames = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
  const activePractices = getActiveUserPractices(state);
  const days = getWeekDates().map((dateString) => {
    const date = new Date(`${dateString}T00:00:00`);
    const completedIds = getCompletedPracticeIds(state, dateString);
    const completed = activePractices.filter((item) => completedIds.has(item.practiceId)).length;
    const total = activePractices.length;
    const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;
    return {
      date: dateString,
      label: dayNames[date.getDay()],
      completed,
      total,
      percentage
    };
  });

  const average = days.length > 0 ? Math.round(days.reduce((sum, day) => sum + day.percentage, 0) / days.length) : 0;
  const mostConsistent = activePractices
    .map((item) => {
      const count = days.filter((day) => getCompletedPracticeIds(state, day.date).has(item.practiceId)).length;
      return { title: item.practice.title, count };
    })
    .sort((a, b) => b.count - a.count)[0] || { title: "-", count: 0 };

  return { days, average, mostConsistent };
}

function getMonthlyReport(state) {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const today = now.getDate();
  const activePractices = getActiveUserPractices(state);

  const days = Array.from({ length: daysInMonth }, (_, index) => {
    const day = index + 1;
    const dateString = `${year}-${String(month + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
    const completedIds = getCompletedPracticeIds(state, dateString);
    const completed = activePractices.filter((item) => completedIds.has(item.practiceId)).length;
    const total = activePractices.length;
    const percentage = total > 0 ? Math.round((completed / total) * 100) : 0;

    return {
      day,
      date: dateString,
      isFuture: day > today,
      completed,
      total,
      percentage,
      isConsistent: total > 0 && completed === total
    };
  });

  const elapsedDays = days.filter((day) => !day.isFuture);
  const average =
    elapsedDays.length > 0 ? Math.round(elapsedDays.reduce((sum, day) => sum + day.percentage, 0) / elapsedDays.length) : 0;
  const consistentDays = elapsedDays.filter((day) => day.isConsistent).length;
  const totalCompleted = elapsedDays.reduce((sum, day) => sum + day.completed, 0);

  return {
    days,
    average,
    consistentDays,
    elapsedDays: elapsedDays.length,
    totalCompleted
  };
}


let state = loadState();
let route = parseRoute();
let selectedPracticeCategory = "semua";
let reportTab = "today";

const navItems = [
  { route: "/home", label: "Utama", icon: "⌂" },
  { route: "/knowledge", label: "Ilmu", icon: "◇" },
  { route: "/practices", label: "Tambah", icon: "+" },
  { route: "/reports", label: "Laporan", icon: "▥" },
  { route: "/profile", label: "Saya", icon: "○" }
];

const app = document.querySelector("#app");

window.addEventListener("hashchange", () => {
  route = parseRoute();
  render();
});

document.addEventListener("click", (event) => {
  const actionElement = event.target.closest("[data-action]");
  if (!actionElement) return;

  const { action, id, route: nextRoute, category, tab } = actionElement.dataset;

  if (action === "navigate") navigate(nextRoute);
  if (action === "select-practice-category") {
    selectedPracticeCategory = category;
    render();
  }
  if (action === "add-practice") {
    addPractice(state, id);
    state = loadState();
    render();
  }
  if (action === "remove-practice") {
    removePractice(state, id);
    state = loadState();
    render();
  }
  if (action === "complete-practice") {
    completePractice(state, id);
    state = loadState();
    render();
  }
  if (action === "report-tab") {
    reportTab = tab;
    render();
  }
  if (action === "reset-demo") {
    state = resetState();
    render();
  }
});

function parseRoute() {
  const hash = window.location.hash.replace(/^#/, "");
  return hash || "/home";
}

function navigate(nextRoute) {
  window.location.hash = nextRoute;
}

function render() {
  const page = renderRoute();
  app.innerHTML = `
    <main class="shell">
      <section class="phone-frame">
        ${page}
        ${renderBottomNav()}
      </section>
    </main>
  `;
}

function renderRoute() {
  if (route.startsWith("/practice/")) {
    return renderPracticeDetail(route.replace("/practice/", ""));
  }
  if (route.startsWith("/knowledge/article/")) {
    return renderArticle(route.replace("/knowledge/article/", ""));
  }
  if (route.startsWith("/knowledge/category/")) {
    return renderKnowledgeCategory(route.replace("/knowledge/category/", ""));
  }

  const routes = {
    "/home": renderHome,
    "/knowledge": renderKnowledge,
    "/practices": renderPractices,
    "/reports": renderReports,
    "/profile": renderProfile
  };

  return (routes[route] || renderHome)();
}

function renderHome() {
  const summary = getDailySummary(state);
  const dateLabel = formatDate(summary.completionDate);
  const practicesMarkup =
    summary.activePractices.length > 0
      ? summary.activePractices.map((item) => renderHomePractice(item, summary.completedIds)).join("")
      : `<div class="empty-state">
          <p>Belum ada amalan aktif.</p>
          <button class="primary-button" data-action="navigate" data-route="/practices">Tambah Amalan</button>
        </div>`;

  return `
    <div class="screen with-nav">
      <header class="home-header">
        <div>
          <p class="eyebrow">Assalamualaikum,</p>
          <h1>${state.user.name}</h1>
          <p class="muted">${dateLabel}</p>
        </div>
        <button class="icon-button" aria-label="Profil" data-action="navigate" data-route="/profile">○</button>
      </header>

      <section class="progress-panel">
        <div>
          <p class="section-kicker">Amalan hari ini</p>
          <strong>${summary.percentage}%</strong>
          <p>${summary.completed} daripada ${summary.total} amalan selesai hari ini</p>
        </div>
        <div class="progress-ring" style="--value: ${summary.percentage}">
          <span>${summary.percentage}%</span>
        </div>
      </section>

      <section class="count-grid" aria-label="Ringkasan harian">
        <div><span>Selesai</span><strong>${summary.completed}</strong></div>
        <div><span>Belum selesai</span><strong>${summary.pending}</strong></div>
        <div><span>Jumlah amalan</span><strong>${summary.total}</strong></div>
      </section>

      <section class="section-block">
        <div class="section-heading">
          <h2>Amalan Saya</h2>
        </div>
        <div class="practice-stack">${practicesMarkup}</div>
      </section>

      <button class="add-practice-button" data-action="navigate" data-route="/practices">
        <span>+</span>
        Tambah Amalan
      </button>
    </div>
  `;
}

function renderHomePractice(item, completedIds) {
  const completed = completedIds.has(item.practiceId);
  return `
    <article
      class="practice-row ${completed ? "is-complete" : ""}"
      data-action="navigate"
      data-route="/practice/${item.practice.slug}"
    >
      <div class="practice-icon">${item.practice.icon}</div>
      <div>
        <h3>${item.practice.title}</h3>
        <p>${item.practice.recommendedTime} · Ketik untuk bacaan</p>
      </div>
      <button
        class="${completed ? "complete-button done" : "complete-button"}"
        data-action="complete-practice"
        data-id="${item.practiceId}"
      >
        ${completed ? "✓ Selesai" : "Tandakan Selesai"}
      </button>
    </article>
  `;
}

function renderPractices() {
  const categories = [
    { id: "semua", name: "Semua" },
    ...practiceCategories.sort((a, b) => a.sortOrder - b.sortOrder)
  ];
  const filteredPractices =
    selectedPracticeCategory === "semua"
      ? practices
      : practices.filter((practice) => practice.categoryId === selectedPracticeCategory);

  return `
    <div class="screen with-nav">
      ${renderTopBar("Tambah Amalan", "Senarai amalan rasmi yang disediakan oleh Pusat Kajian.")}
      <div class="chip-row">
        ${categories
          .map(
            (category) => `
              <button
                class="chip ${selectedPracticeCategory === category.id ? "active" : ""}"
                data-action="select-practice-category"
                data-category="${category.id}"
              >
                ${category.name}
              </button>
            `
          )
          .join("")}
      </div>
      <section class="card-list">
        ${filteredPractices.map(renderPracticeCard).join("")}
      </section>
    </div>
  `;
}

function renderPracticeCard(practice) {
  const added = isPracticeAdded(state, practice.id);
  const category = practiceCategories.find((item) => item.id === practice.categoryId);
  return `
    <article
      class="library-card"
      data-action="navigate"
      data-route="/practice/${practice.slug}"
    >
      <div class="visual-tile">
        <span>${practice.icon}</span>
      </div>
      <div class="library-body">
        <div>
          <p class="category-label">${category?.name || "Amalan"}</p>
          <h3>${practice.title}</h3>
          <p>${practice.description}</p>
          <span class="time-pill">${practice.recommendedTime}</span>
        </div>
        <button
          class="${added ? "secondary-button added" : "primary-button compact"}"
          data-action="add-practice"
          data-id="${practice.id}"
          ${added ? "disabled" : ""}
        >
          ${added ? "✓ Telah ditambah" : "+ Tambah"}
        </button>
      </div>
    </article>
  `;
}

function renderPracticeDetail(slug) {
  const practice = practices.find((item) => item.slug === slug);
  if (!practice) {
    return `
      <div class="screen with-nav">
        ${renderBackBar("Amalan", "/home")}
        <div class="empty-state"><p>Amalan tidak ditemui.</p></div>
      </div>
    `;
  }

  const category = practiceCategories.find((item) => item.id === practice.categoryId);
  const added = isPracticeAdded(state, practice.id);
  const summary = getDailySummary(state);
  const completed = summary.completedIds.has(practice.id);
  const guide = practice.practiceGuide;

  return `
    <div class="screen with-nav">
      ${renderBackBar("Perincian Amalan", added ? "/home" : "/practices")}
      <article class="practice-detail">
        <div class="practice-detail-header">
          <div class="practice-icon large">${practice.icon}</div>
          <div>
            <p class="category-label">${category?.name || "Amalan"}</p>
            <h1>${practice.title}</h1>
            <p>${practice.description}</p>
            <span class="time-pill">${practice.recommendedTime}</span>
          </div>
        </div>

        <section class="recitation-card">
          <p class="section-kicker">${guide?.arabicTitle || "Bacaan amalan"}</p>
          ${(guide?.arabicText || []).map((text) => `<p class="arabic-text" dir="rtl" lang="ar">${text}</p>`).join("")}
        </section>

        <section class="meaning-card">
          <h2>Maksud dalam Bahasa Melayu</h2>
          ${(guide?.meaning || []).map((text) => `<p>${text}</p>`).join("")}
        </section>

        <section class="evidence-card">
          <h2>Dalil dan Sumber</h2>
          <p>${guide?.evidence || "Dalil akan dikemas kini oleh pihak admin."}</p>
        </section>

        ${
          guide?.note
            ? `<section class="note-card">
                <h2>Nota Amalan</h2>
                <p>${guide.note}</p>
              </section>`
            : ""
        }

        <div class="detail-actions">
          ${
            added
              ? `<button
                  class="${completed ? "secondary-button added" : "primary-button"}"
                  data-action="complete-practice"
                  data-id="${practice.id}"
                >
                  ${completed ? "✓ Selesai hari ini" : "Tandakan Selesai"}
                </button>`
              : `<button class="primary-button" data-action="add-practice" data-id="${practice.id}">
                  + Tambah ke Amalan Saya
                </button>`
          }
        </div>
      </article>
    </div>
  `;
}

function renderKnowledge() {
  return `
    <div class="screen with-nav">
      ${renderTopBar("Ilmu", "Kandungan pendidikan daripada Pusat Kajian.")}
      <section class="knowledge-grid">
        ${knowledgeCategories
          .sort((a, b) => a.sortOrder - b.sortOrder)
          .map(
            (category) => `
              <button class="knowledge-card" data-action="navigate" data-route="/knowledge/category/${category.id}">
                <span>${category.icon}</span>
                <strong>${category.title}</strong>
                <small>${category.description}</small>
              </button>
            `
          )
          .join("")}
      </section>
    </div>
  `;
}

function renderKnowledgeCategory(categoryId) {
  const category = knowledgeCategories.find((item) => item.id === categoryId);
  const articles = knowledgeArticles.filter((article) => article.categoryId === categoryId && article.isPublished);

  return `
    <div class="screen with-nav">
      ${renderBackBar(category?.title || "Ilmu", "/knowledge")}
      <p class="screen-copy">${category?.description || ""}</p>
      <section class="article-list">
        ${
          articles.length
            ? articles.map(renderArticlePreview).join("")
            : `<div class="empty-state"><p>Kandungan kategori ini akan ditambah.</p></div>`
        }
      </section>
    </div>
  `;
}

function renderArticlePreview(article) {
  return `
    <button class="article-preview" data-action="navigate" data-route="/knowledge/article/${article.slug}">
      <span>Baca</span>
      <strong>${article.title}</strong>
      <small>${article.excerpt}</small>
    </button>
  `;
}

function renderArticle(slug) {
  const article = knowledgeArticles.find((item) => item.slug === slug);
  if (!article) {
    return `
      <div class="screen with-nav">
        ${renderBackBar("Artikel", "/knowledge")}
        <div class="empty-state"><p>Artikel tidak ditemui.</p></div>
      </div>
    `;
  }

  const relatedPractice = practices.find((practice) => practice.id === article.relatedPracticeId);
  const added = relatedPractice ? isPracticeAdded(state, relatedPractice.id) : false;

  return `
    <div class="screen with-nav">
      ${renderBackBar("Artikel", `/knowledge/category/${article.categoryId}`)}
      <article class="article">
        <p class="category-label">${getKnowledgeCategoryTitle(article.categoryId)}</p>
        <h1>${article.title}</h1>
        <p class="lead">${article.excerpt}</p>
        ${article.sections
          .map(
            ([heading, content]) => `
              <section>
                <h2>${heading}</h2>
                <p>${content}</p>
              </section>
            `
          )
          .join("")}
      </article>
      ${
        relatedPractice
          ? `<section class="related-practice">
              <p class="section-kicker">Amalan berkaitan</p>
              <div>
                <strong>${relatedPractice.title}</strong>
                <span>${relatedPractice.recommendedTime}</span>
              </div>
              <button
                class="${added ? "secondary-button added" : "primary-button"}"
                data-action="add-practice"
                data-id="${relatedPractice.id}"
                ${added ? "disabled" : ""}
              >
                ${added ? "✓ Sudah dalam Amalan Saya" : "+ Jadikan Amalan Saya"}
              </button>
            </section>`
          : ""
      }
    </div>
  `;
}

function renderReports() {
  const tabs = [
    ["today", "Hari Ini"],
    ["yesterday", "Semalam"],
    ["weekly", "Mingguan"],
    ["monthly", "Bulanan"]
  ];

  return `
    <div class="screen with-nav">
      ${renderTopBar("Laporan", "Ruang muhasabah terhadap konsistensi amalan.")}
      <div class="tab-row">
        ${tabs
          .map(
            ([id, label]) => `
              <button class="tab ${reportTab === id ? "active" : ""}" data-action="report-tab" data-tab="${id}">
                ${label}
              </button>
            `
          )
          .join("")}
      </div>
      ${renderReportContent()}
    </div>
  `;
}

function renderReportContent() {
  if (reportTab === "weekly") return renderWeeklyReport();
  if (reportTab === "monthly") return renderMonthlyReport();
  return renderDailyReport(reportTab === "yesterday" ? getLocalDate(-1) : getLocalDate());
}

function renderDailyReport(dateString) {
  const summary = getDailySummary(state, dateString);
  return `
    <section class="report-panel">
      <p class="section-kicker">${formatDate(dateString)}</p>
      <strong>${summary.percentage}%</strong>
      <p>${summary.completed} daripada ${summary.total} amalan telah diselesaikan</p>
    </section>
    <section class="report-list">
      ${summary.activePractices
        .map((item) => {
          const completed = summary.completedIds.has(item.practiceId);
          return `
            <div class="report-row">
              <span class="${completed ? "status done" : "status"}">${completed ? "✓" : "○"}</span>
              <span>${item.practice.title}</span>
            </div>
          `;
        })
        .join("")}
    </section>
  `;
}

function renderWeeklyReport() {
  const report = getWeeklyReport(state);
  return `
    <section class="report-panel">
      <p class="section-kicker">Purata mingguan</p>
      <strong>${report.average}%</strong>
      <p>Amalan paling konsisten: ${report.mostConsistent.title} (${report.mostConsistent.count} daripada 7 hari)</p>
    </section>
    <section class="chart-list">
      ${report.days
        .map(
          (day) => `
            <div class="chart-row">
              <span>${day.label}</span>
              <div class="bar"><i style="width: ${day.percentage}%"></i></div>
              <strong>${day.percentage}%</strong>
            </div>
          `
        )
        .join("")}
    </section>
  `;
}

function renderMonthlyReport() {
  const report = getMonthlyReport(state);
  return `
    <section class="report-panel">
      <p class="section-kicker">Purata bulanan</p>
      <strong>${report.average}%</strong>
      <p>Hari konsisten: ${report.consistentDays} daripada ${report.elapsedDays}</p>
    </section>
    <section class="calendar-grid">
      ${report.days
        .map(
          (day) => `
            <div class="calendar-day ${day.isFuture ? "future" : ""} ${day.isConsistent ? "consistent" : ""}">
              <span>${day.day}</span>
              <strong>${day.isFuture ? "" : day.isConsistent ? "✓" : "○"}</strong>
            </div>
          `
        )
        .join("")}
    </section>
    <section class="count-grid soft">
      <div><span>Hari konsisten</span><strong>${report.consistentDays}</strong></div>
      <div><span>Jumlah selesai</span><strong>${report.totalCompleted}</strong></div>
    </section>
  `;
}

function renderProfile() {
  const activePractices = getActiveUserPractices(state);
  return `
    <div class="screen with-nav">
      ${renderTopBar("Saya", "Profil dan pengurusan amalan.")}
      <section class="profile-card">
        <div class="avatar">${state.user.name.slice(0, 1)}</div>
        <div>
          <h2>${state.user.name}</h2>
          <p>${state.user.email}</p>
        </div>
      </section>
      <section class="section-block">
        <div class="section-heading">
          <h2>Amalan Saya</h2>
          <span>${activePractices.length} amalan aktif</span>
        </div>
        <div class="manage-list">
          ${activePractices
            .map(
              (item) => `
                <div class="manage-row">
                  <span>${item.practice.title}</span>
                  <button data-action="remove-practice" data-id="${item.practiceId}">Keluarkan</button>
                </div>
              `
            )
            .join("")}
        </div>
      </section>
      <section class="settings-list">
        <button>Pemberitahuan</button>
        <button>Peringatan</button>
        <button>Paparan</button>
        <button>Privasi</button>
        <button>Tentang Pusat Kajian</button>
        <button data-action="reset-demo">Tetapkan Semula Data Contoh</button>
      </section>
    </div>
  `;
}

function renderBottomNav() {
  return `
    <nav class="bottom-nav" aria-label="Navigasi utama">
      ${navItems
        .map(
          (item) => `
            <button
              class="${isNavActive(item.route) ? "active" : ""}"
              data-action="navigate"
              data-route="${item.route}"
            >
              <span>${item.icon}</span>
              ${item.label}
            </button>
          `
        )
        .join("")}
    </nav>
  `;
}

function renderTopBar(title, subtitle) {
  return `
    <header class="top-bar">
      <div>
        <h1>${title}</h1>
        <p>${subtitle}</p>
      </div>
    </header>
  `;
}

function renderBackBar(title, backRoute) {
  return `
    <header class="back-bar">
      <button class="icon-button" data-action="navigate" data-route="${backRoute}" aria-label="Kembali">‹</button>
      <h1>${title}</h1>
    </header>
  `;
}

function isNavActive(navRoute) {
  if (navRoute === "/home" && route.startsWith("/practice/")) return true;
  if (navRoute === "/knowledge" && route.startsWith("/knowledge")) return true;
  return route === navRoute;
}

function getKnowledgeCategoryTitle(categoryId) {
  return knowledgeCategories.find((category) => category.id === categoryId)?.title || "Ilmu";
}

function formatDate(dateString) {
  return new Intl.DateTimeFormat("ms-MY", {
    weekday: "long",
    day: "numeric",
    month: "long",
    year: "numeric"
  }).format(new Date(`${dateString}T00:00:00`));
}

if (!window.location.hash) {
  window.location.hash = "/home";
} else {
  render();
}
